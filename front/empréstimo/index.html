<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela de Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .caixa {
      width: 300px;
      margin: 80px auto;
      background-color: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #333;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #245a92;
    }
  </style>
</head>
<body>
  <div class="caixa">
    <h1>Entrar</h1>
    <input type="email" placeholder="E-mail">
    <input type="password" placeholder="Senha">
    <button>Login</button>
  </div>
</body>
</html>
