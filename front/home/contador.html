<!DOCTYPE html>
<html>

<body>
<h1>JavaScript Project</h1>
<h2>Counter</h2>

<p id="count" style="font-size:40px;">0</p>

<button onclick="increaseCount()">+</button>
<button onclick="decreaseCount()">-</button>
<button onclick="resetCount()">Reset</button>
<button onclick="saveCount()">Save</button>
<button onclick="loadCount()">Load</button>

<script>
// Declara a variável contador
let count = 0;

// Função para mostrar o contador

function updateCount() {
  document.getElementById("count").innerHTML = count;
}

// Função para aumentar o contador

function increaseCount() {
  count++;
  updateCount();
}

// Função para diminuir o contador

function decreaseCount() {
  count--;
  updateCount();
}

// Função para resetar ou zerar o contador

function resetCount() {
  count = 0;
  updateCount();
}

// Função para salvar o contador
function saveCount() {
  localStorage.setItem("count", count);
}

// Função para carregar o contador

function loadCount() {
  let saved = localStorage.getItem("count");
  if (saved !== null) {
    count = Number(saved);
  }
  updateCount();
}
</script>

</body>

</html>
